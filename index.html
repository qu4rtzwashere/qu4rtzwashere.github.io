<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt.</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff6b8b; margin-bottom: 10px; }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ffccd5;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }
        input:focus { border-color: #ff6b8b; }
        button {
            background-color: #ff6b8b;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #ff4773; }
        #response {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #d6336c;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Congratulations! 🎉</h1>
    <p>You found the final stop. Enter the secret code to unlock your final message:</p>
    
    <input type="text" id="secretInput" placeholder="Enter code here...">
    <br>
    <button onclick="checkCode()">Unlock</button>

    <div id="response"></div>
</div>

<script>
function checkCode() {
    // 1. Get what they typed and clean it up (lowercase, no extra spaces)
    const guess = document.getElementById("secretInput").value.trim().toLowerCase();
    const responseDiv = document.getElementById("response");

    // 2. Set your secret code here (must be lowercase)
    const secretCode = "heart"; 

    // 3. Check the code
    if (guess === secretCode) {
        responseDiv.innerHTML = "I love you so much i wasted so much of both of our times just to say i love you.";
    } else if (guess === "") {
        responseDiv.innerHTML = "Please enter a code!";
    } else {
        responseDiv.innerHTML = "not the right code. Try again!";
    }
}
</script>

</body>
</html>
