<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Very dark grey background */
            color: #e0e0e0; /* Light grey text for readability */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e; /* Slightly lighter dark grey container */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff3355; margin-bottom: 10px; } /* Pinkish red color */
        p { margin-bottom: 20px; font-size: 16px; line-height: 1.5; }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            background-color: #2a2a2a; /* Dark input field */
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }
        input:focus { border-color: #ff3355; } /* Pinkish red focus border */
        button {
            background-color: #ff3355; /* Pinkish red button */
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e61a3c; }
        #response {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ff3355; /* Pinkish red response text */
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Final Stop</h1>
    <p>Enter the code.:</p>
    
    <input type="text" id="secretInput" placeholder="Enter code here...">
    <br>
    <button onclick="checkCode()">Unlock</button>

    <div id="response"></div>
</div>

<script>
function checkCode() {
    // 1. Get what they typed and clean it up (lowercase, no extra spaces)
    const guess = document.getElementById("secretInput").value.trim().toLowerCase();
    const responseDiv = document.getElementById("response");

    // 2. Set your secret code here (must be lowercase)
    const secretCode = "YAP"; 

    // 3. Check the code
    if (guess === secretCode) {
        responseDiv.innerHTML = "I love you so incredibly much i wasted so much of both of our times just to say this.";
    } else if (guess === "") {
        responseDiv.innerHTML = "Please enter a code!";
    } else {
        responseDiv.innerHTML = "Not the right code. Try again.";
    }
}
</script>

</body>
</html>
